[package]
name = "babel-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
babel-core = { version = "0.1.0", path = "../babel-core" }
babel-server = { version = "0.1.0", path = "../babel-server" }
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
