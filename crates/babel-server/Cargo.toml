[package]
name = "babel-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
babel-core = { version = "0.1.0", path = "../babel-core" }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
mime_guess = { version = "2.0.5", optional = true }
rpassword = "7.5.4"
rust-embed = { version = "8.13.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["compression-full", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json", "cookies"] }

[features]
# The web app (web/) built into the binary and served. The desktop app,
# which uses the store and the change broadcasts only, goes without.
default = ["web"]
web = ["dep:rust-embed", "dep:mime_guess"]
