[package]
name = "babel-pages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
babel-docx = { version = "0.1.0", path = "../babel-docx" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
quick-xml = "0.42.0"
thiserror = "2.0.21"
wordcraft-doc = { git = "https://github.com/inthevidual/wordcraft", rev = "edcff3ebc647ff62251f24e278747d9f139cc139", version = "0.12.0" }
wordcraft-docx = { git = "https://github.com/inthevidual/wordcraft", rev = "edcff3ebc647ff62251f24e278747d9f139cc139", version = "0.12.0" }
wordcraft-layout = { git = "https://github.com/inthevidual/wordcraft", rev = "edcff3ebc647ff62251f24e278747d9f139cc139", version = "0.12.0" }
wordcraft-render = { git = "https://github.com/inthevidual/wordcraft", rev = "edcff3ebc647ff62251f24e278747d9f139cc139", version = "0.12.0" }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.154"
wordcraft-doc = { git = "https://github.com/inthevidual/wordcraft", rev = "edcff3ebc647ff62251f24e278747d9f139cc139" }
