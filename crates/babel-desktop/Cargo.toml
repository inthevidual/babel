[package]
name = "babel-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
babel-core = { version = "0.1.0", path = "../babel-core" }
babel-docx = { version = "0.1.0", path = "../babel-docx" }
babel-editor = { version = "0.1.0", path = "../babel-editor" }
babel-pages = { version = "0.1.0", path = "../babel-pages" }
babel-server = { version = "0.1.0", path = "../babel-server", default-features = false }
babel-sync = { version = "0.1.0", path = "../babel-sync" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
wordcraft-doc = { git = "https://github.com/inthevidual/wordcraft", rev = "edcff3ebc647ff62251f24e278747d9f139cc139", version = "0.12.0" }

[build-dependencies]
cxx-qt-build = "0.10.0"
