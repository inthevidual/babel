[package]
name = "babel-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
babel-core = { version = "0.1.0", path = "../babel-core" }
babel-pages = { version = "0.1.0", path = "../babel-pages" }
babel-server = { version = "0.1.0", path = "../babel-server" }
babel-sync = { version = "0.1.0", path = "../babel-sync" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }

[build-dependencies]
cxx-qt-build = "0.10.0"
