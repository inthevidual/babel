[package]
name = "babel-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
babel-docx = { version = "0.1.0", path = "../babel-docx" }
babel-pages = { version = "0.1.0", path = "../babel-pages" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
web-time = "1.1.0"
wordcraft-doc = { git = "https://github.com/inthevidual/wordcraft", rev = "edcff3ebc647ff62251f24e278747d9f139cc139", version = "0.12.0" }
wordcraft-layout = { git = "https://github.com/inthevidual/wordcraft", rev = "edcff3ebc647ff62251f24e278747d9f139cc139", version = "0.12.0" }

[dev-dependencies]
wordcraft-doc = { git = "https://github.com/inthevidual/wordcraft", rev = "edcff3ebc647ff62251f24e278747d9f139cc139" }
