[package]
name = "babel-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
getrandom = "0.4.3"
hex = "0.4.3"
quick-xml = "0.42.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4"] }
zstd = "0.14.3"

[dev-dependencies]
tempfile = "3.27.0"
